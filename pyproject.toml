[project]
name = "stata2ducklake"
version = "0.2.0"
description = "Convert Stata .dta files into partitioned Parquet with DuckLake metadata"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb>=1.2",
    "pandas>=2.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stata2ducklake = "stata2ducklake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stata2ducklake"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
